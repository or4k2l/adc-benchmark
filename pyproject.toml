[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adc-benchmark"
version = "0.1.0"
description = "Benchmark suite for error-mitigation strategies on superconducting qubits"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2.0",
    "matplotlib>=3.7",
    "qutip>=5.0,<6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
adc-benchmark = "src.adc_benchmark:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
